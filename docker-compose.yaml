services:
  api:
    # Replace <owner-or-org> with the lowercase GitHub owner before publishing.
    image: nova-era-api:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NOVA_ERA_API_PORT:-8080}:8080"
    volumes:
      - nova_era_instances:/nova-era/instances
    networks:
      - nova-era-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - nova_era_redis:/data
    networks:
      nova-era-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nova_era_postgres:/var/lib/postgresql/data
    networks:
      - nova-era-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nova_era_instances:
  nova_era_redis:
  nova_era_postgres:

networks:
  nova-era-net:
    name: nova-era-net
    driver: bridge
