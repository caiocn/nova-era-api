name: Bug report
description: Report a reproducible Nova Era API defect
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Search existing reports before filing. Do not include API keys, session credentials, phone numbers, webhook secrets or customer content. For vulnerabilities, use SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide safe, redacted steps, request shapes and fixtures.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Nova Era API version/commit:
        - Upstream base (if known):
        - Node/Docker version:
        - Database provider:
        - Redis/session mode:
        - Integration/channel involved:
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove secrets and personal data before posting.
      render: shell
