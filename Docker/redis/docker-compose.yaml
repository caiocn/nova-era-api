version: '3.3'

services:
  redis:
    image: redis:latest
    networks:
      - nova-era-net
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - nova_era_redis:/data
    ports:
      - 6379:6379

volumes:
  nova_era_redis:


networks:
  nova-era-net:
    name: nova-era-net
    driver: bridge
